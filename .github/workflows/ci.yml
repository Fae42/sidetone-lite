name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build application
        shell: msys2 {0}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Run tests
        shell: msys2 {0}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./test.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: sidetone-lite-windows-x64
          path: dist/Jianting.exe
          if-no-files-found: error
          retention-days: 14
